[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
# --include=dev keeps build tools (vite, esbuild) even when NODE_ENV=production,
# which otherwise causes npm to omit devDependencies and break the build.
cmds = ['npm ci --include=dev']

[phases.build]
cmds = ['npm run build']

[start]
cmd = 'npm start'
